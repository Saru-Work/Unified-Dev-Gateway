services:
  wso2am:
    image: wso2/wso2am:4.7.0
    container_name: wso2am
    ports:
      - "9443:9443"
      - "8243:8243"
      - "8280:8280"
    volumes:
      - wso2am-470-deployment:/home/wso2carbon/wso2am-4.7.0/repository/deployment/server
      - wso2am-470-database:/home/wso2carbon/wso2am-4.7.0/repository/database
    networks:
      - devgateway
    healthcheck:
      test:
        - CMD
        - curl
        - -k
        - -f
        - -s
        - https://localhost:9443/api/am/gateway/v2/server-startup-healthcheck
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  mongo:
    image: mongo:8
    container_name: mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - devgateway
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "4000:4000"
    environment:
      WSO2_BASE_URL: https://wso2am:9443/api/am/devportal/v3
      WSO2_ALLOW_SELF_SIGNED: "true"
      MONGO_URI: mongodb://mongo:27017/opengate
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ bytes) in .env}
    networks:
      - devgateway
    depends_on:
      wso2am:
        condition: service_healthy
      mongo:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:4000
    networks:
      - devgateway
    depends_on:
      - backend

networks:
  devgateway:
    driver: bridge

volumes:
  mongo-data:
  wso2am-470-deployment:
  wso2am-470-database: