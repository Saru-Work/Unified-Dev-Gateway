services:
  # One-shot: the image has no solr/ directory, so Docker creates its volume
  # owned by root; hand it to WSO2's user (10001) before WSO2 starts.
  wso2am-init:
    image: busybox:1.37.0
    command: ["chown", "10001:10001", "/solr"]
    volumes:
      - wso2am-470-solr:/solr

  wso2am:
    image: wso2/wso2am:4.7.0
    container_name: wso2am
    # Turns on gateway analytics (see wso2-config/wso2-start.sh), then runs
    # the image's usual entrypoint.
    entrypoint: ["/bin/sh", "/opengate/wso2-start.sh"]
    depends_on:
      wso2am-init:
        condition: service_completed_successfully
    environment:
      # Optional: pin WSO2's encryption key (64 hex characters). Otherwise one
      # is kept on the database volume; see wso2-config/wso2-start.sh.
      WSO2_ENCRYPTION_KEY: ${WSO2_ENCRYPTION_KEY:-}
    ports:
      - "9443:9443"
      - "8243:8243"
      - "8280:8280"
    volumes:
      - wso2am-470-deployment:/home/wso2carbon/wso2am-4.7.0/repository/deployment/server
      - wso2am-470-database:/home/wso2carbon/wso2am-4.7.0/repository/database
      - ./wso2-config/wso2-start.sh:/opengate/wso2-start.sh:ro
      # Shared with the backend, which reads apim_metrics.log for usage.
      - wso2am-470-logs:/home/wso2carbon/wso2am-4.7.0/repository/logs
      # The API search index; see wso2-config/wso2-start.sh.
      - wso2am-470-solr:/home/wso2carbon/wso2am-4.7.0/solr
    networks:
      - devgateway
    healthcheck:
      test:
        - CMD
        - curl
        - -k
        - -f
        - -s
        - https://localhost:9443/api/am/gateway/v2/server-startup-healthcheck
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  mongo:
    image: mongo:8
    container_name: mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - devgateway
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "4000:4000"
    environment:
      WSO2_BASE_URL: https://wso2am:9443/api/am/devportal/v3
      WSO2_ALLOW_SELF_SIGNED: "true"
      MONGO_URI: mongodb://mongo:27017/opengate
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ bytes) in .env}
      # The gateway's analytics log, read for per-application usage.
      USAGE_METRICS_LOG: /wso2-logs/apim_metrics.log
      # The WSO2 account OpenGate acts as. admin/admin is WSO2's out-of-the-box login.
      WSO2_USERNAME: ${WSO2_USERNAME:-admin}
      WSO2_PASSWORD: ${WSO2_PASSWORD:-admin}
      WSO2_CLIENT_ID: ${WSO2_CLIENT_ID:-}
      WSO2_CLIENT_SECRET: ${WSO2_CLIENT_SECRET:-}
    volumes:
      - wso2am-470-logs:/wso2-logs:ro
    networks:
      - devgateway
    depends_on:
      wso2am:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      # /ready checks Mongo and WSO2 too; the image has node but no curl.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:4000
    networks:
      - devgateway
    depends_on:
      backend:
        condition: service_healthy

networks:
  devgateway:
    driver: bridge

volumes:
  mongo-data:
  wso2am-470-deployment:
  wso2am-470-database:
  wso2am-470-logs:
  wso2am-470-solr: