# OpenGate behind nginx on the VPS host. See README §9, "Deploying to a VPS".
#
#   app.example.com      → dashboard (:3000)
#   portal.example.com   → WSO2 Publisher (:9443), for registering APIs
#   gateway.example.com  → WSO2 gateway (:8243), where applications call APIs
#   api.example.com      → OpenGate REST API (:4000), for scripts and CI
#
# Replace example.com with your domain everywhere in this file. Docker binds
# every service to 127.0.0.1, so nginx is the only way in.
#
# "listen 443 ssl http2" works on nginx 1.24 (Ubuntu 24.04); newer nginx
# warns that it's deprecated, which is harmless.
#
# One certificate covers all four names; get it before enabling this file:
#   certbot certonly --nginx -d app.example.com -d portal.example.com \
#     -d gateway.example.com -d api.example.com

# Login and token endpoints on WSO2: slows password guessing against the
# Publisher accounts and client secrets.
limit_req_zone $binary_remote_addr zone=opengate_wso2_auth:10m rate=10r/m;

map $http_upgrade $opengate_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com portal.example.com gateway.example.com api.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ── Dashboard ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # Overwritten, never appended: the dashboard forwards X-Real-IP to the
        # backend's login rate limit, so clients mustn't be able to set it.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Makes the session cookie Secure.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# ── WSO2 Publisher ──────────────────────────────────────────────────────────
# Set WSO2_HOSTNAME=portal.example.com in .env so WSO2 builds its login
# redirects for this name. Only the Publisher and its sign-in are public.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 20m;          # OpenAPI and archive uploads
    proxy_buffer_size 16k;             # WSO2's sign-in sets large headers
    proxy_buffers 8 16k;

    # Headers as in WSO2 4.7.0's own nginx example ("Configuring the Proxy
    # Server and the Load Balancer"), with X-Forwarded-For overwritten.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 5m;
    proxy_send_timeout 5m;
    proxy_ssl_verify off;              # WSO2's self-signed certificate, over loopback
    proxy_redirect https://$host:9443/ https://$host/;

    location = / { return 302 /publisher/; }

    # WSO2's other consoles and admin APIs: only from addresses listed in
    # opengate-admin-ips.conf (e.g. "allow 203.0.113.7;"). Use them to manage
    # Publisher accounts (/carbon → Users and Roles) and throttling policies (/admin).
    location ~ ^/(carbon|admin|api/am/admin)(/|$) {
        include /etc/nginx/opengate-admin-ips.conf;
        deny all;
        proxy_pass https://127.0.0.1:9443;
    }

    # Never public. OpenGate is the developer portal, so WSO2's DevPortal and
    # its API stay closed: apps made there would have no OpenGate owner.
    location ~ ^/(devportal|api/am/devportal|api/am/gateway|services|keymanager-operations|client-registration|scim2|api/identity|api/server|t)(/|$) {
        return 404;
    }

    # Sign-in and tokens (the user guide sends developers to /oauth2/token for
    # the client-credentials grant).
    location ~ ^/(oauth2/token|commonauth)$ {
        limit_req zone=opengate_wso2_auth burst=20 nodelay;
        proxy_pass https://127.0.0.1:9443;
    }

    location / {
        proxy_pass https://127.0.0.1:9443;
    }
}

# ── WSO2 gateway ────────────────────────────────────────────────────────────
# Set WSO2_GATEWAY_HOST=gateway.example.com in .env. WSO2 routes by vhost,
# so Host must be passed through unchanged.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gateway.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass https://127.0.0.1:8243;
        proxy_ssl_verify off;          # WSO2's self-signed certificate, over loopback
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $opengate_connection;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 5m;
    }
}

# ── OpenGate REST API (optional) ────────────────────────────────────────────
# For scripts and CI. Remove this block to keep the API private; the
# dashboard reaches the backend directly either way.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        # Overwritten, never appended: the backend trusts one hop (TRUST_PROXY=1).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
